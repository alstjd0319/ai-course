<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토스페이먼츠 주문서형 결제 테스트</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        #payment-method { margin-bottom: 20px; border: 1px solid #eee; padding: 10px; border-radius: 8px; }
        #agreement { margin-bottom: 20px; border: 1px solid #eee; padding: 10px; border-radius: 8px; }
        button { 
            padding: 12px 24px; 
            background-color: #3182f6; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%;
        }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        h1 { font-size: 24px; }
    </style>
</head>
<body>
    <h1>토스페이먼츠 주문서형 결제 테스트</h1>
    <div id="payment-method"></div>
    <div id="agreement"></div>
    <button id="payment-button" disabled>결제하기</button>

    <script>
        const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
        const customerKey = "TossPayments.ANONYMOUS";

        const tossPayments = TossPayments(clientKey);
        const widgets = tossPayments.widgets({ customerKey });

        widgets.setAmount({
            currency: "KRW",
            value: 1000
        });

        widgets.renderPaymentMethods({
            selector: "#payment-method",
            variantKey: "DEFAULT"
        });

        const agreementWidget = widgets.renderAgreement({
            selector: "#agreement",
            variantKey: "AGREEMENT"
        });

        agreementWidget.on('agreementStatusChange', (status) => {
            const button = document.getElementById('payment-button');
            button.disabled = !status.agreedRequiredTerms;
        });

        document.getElementById('payment-button').addEventListener('click', async () => {
            try {
                await widgets.requestPayment({
                    orderId: Math.random().toString(36).substring(2, 11),
                    orderName: "테스트 상품",
                    successUrl: window.location.origin + "/success",
                    failUrl: window.location.origin + "/fail",
                });
            } catch (error) {
                console.error("결제 요청 중 오류 발생:", error);
            }
        });
    </script>
</body>
</html>
