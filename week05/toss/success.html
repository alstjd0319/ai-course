<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 성공</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; width: 30%; }
        h1 { color: #2ecc71; }
    </style>
</head>
<body>
    <h1>✅ 결제 성공</h1>
    <p>결제가 정상적으로 완료되었습니다.</p>
    <table id="result-table">
        <thead>
            <tr>
                <th>항목</th>
                <th>값</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tableBody = document.querySelector('#result-table tbody');

        // 표시할 키 목록
        const keysToDisplay = ['paymentKey', 'orderId', 'amount'];

        keysToDisplay.forEach(key => {
            const value = urlParams.get(key);
            if (value !== null) {
                const row = tableBody.insertRow();
                const cell1 = row.insertCell(0);
                const cell2 = row.insertCell(1);
                cell1.textContent = key;
                cell2.textContent = value;
            }
        });

        if (tableBody.rows.length === 0) {
            tableBody.insertRow().insertCell(0).textContent = "전달된 파라미터가 없습니다.";
            tableBody.rows[0].insertCell(1).textContent = "-";
        }
    </script>
</body>
</html>
