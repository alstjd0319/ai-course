<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나눠 내기 계산기</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            -webkit-appearance: none; /* iOS default styling 제거 */
        }
        input:focus {
            border-color: #3498db;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:active {
            background-color: #2980b9;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #e8f4fd;
            border-radius: 12px;
            text-align: center;
        }
        .result-label {
            font-size: 14px;
            color: #5d6d7e;
        }
        .result-value {
            font-size: 28px;
            font-weight: bold;
            color: #2980b9;
            margin-top: 5px;
        }
        .error-box {
            margin-top: 20px;
            padding: 10px;
            background-color: #fdecea;
            color: #e74c3c;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 나눠 내기</h1>
        
        <form method="POST">
            <div class="form-group">
                <label for="amount">총 금액 (원)</label>
                <input type="number" id="amount" name="amount" placeholder="예: 50000" required inputmode="numeric">
            </div>
            <div class="form-group">
                <label for="people">인원 수 (명)</label>
                <input type="number" id="people" name="people" placeholder="예: 4" required inputmode="numeric">
            </div>
            <button type="submit">계산하기</button>
        </form>

        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        {% if result is not none %}
        <div class="result-box">
            <div class="result-label">1인당 내야 할 금액</div>
            <div class="result-value">{{ "{:,}".format(result) }}원</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
